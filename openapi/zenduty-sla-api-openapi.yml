openapi: 3.0.0
info:
  version: 1.1.0
  title: Zenduty Account Custom Role SLA API
  termsOfService: https://zenduty.com
  contact:
    email: vishwa@zenduty.com
  license:
    name: Apache 2.0
  x-logo:
    url: data:image/svg+xml;base64,
  description: "# Introduction\n\nZenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.\n\n\n  Javascript Libraries: https://github.com/Zenduty/zenduty-js\n\n  Ruby Libraries: https://github.com/Zenduty/zenduty-ruby\n\n  Python Libraries: https://github.com/Zenduty/zenduty-python-sdk\n\n  Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git\n\n  Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions\n\n  Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions\n"
servers:
- url: https://www.zenduty.com
security:
- bearerAuth: []
tags:
- name: SLA
  description: This object represents the SLA of an incident. You can checkout the SLA docs here https://docs.zenduty.com/docs/incidentsla
paths:
  /api/account/teams/{}/sla/:
    parameters:
    - name: team_id
      in: path
      description: unique_id of the Team object
      schema:
        type: string
      required: true
    post:
      tags:
      - SLA
      summary: Create the SLA object
      description: Create the SLA object by setting the values of all the required parameters passed in the request body.
      requestBody:
        description: Request body parameters to create the SLA object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLAPayload'
            example:
              name: New Infra SLA
              escalations: []
          application/xml:
            schema:
              $ref: '#/components/schemas/SLAPayload'
            example:
              name: New Infra SLA
              escalations: []
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPostPut'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
            application/xml:
              schema:
                $ref: '#/components/schemas/SLAPostPut'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    get:
      tags:
      - SLA
      summary: List all SLA objects
      description: Returns a list of SLA objects.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAGet'
              example:
              - unique_id: b3c6af23-2b9e-414e-9706-bbf3af76828c
                name: Infra SLA
                is_active: true
                acknowledge_time: 30
                resolve_time: 60
                creation_date: '2022-07-08T12:29:08.545605Z'
              - unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                is_active: true
                acknowledge_time: null
                resolve_time: null
                creation_date: '2022-07-08T14:45:21.096085Z'
            application/xml:
              schema:
                $ref: '#/components/schemas/SLAGet'
              example:
              - unique_id: b3c6af23-2b9e-414e-9706-bbf3af76828c
                name: Infra SLA
                is_active: true
                acknowledge_time: 30
                resolve_time: 60
                creation_date: '2022-07-08T12:29:08.545605Z'
              - unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                is_active: true
                acknowledge_time: null
                resolve_time: null
                creation_date: '2022-07-08T14:45:21.096085Z'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
  /api/account/teams/{team_id}/sla/{sla_id}/:
    parameters:
    - name: team_id
      in: path
      description: unique_id of the Team object
      schema:
        type: string
      required: true
    - name: sla_id
      in: path
      description: unique_id of the SLA object
      schema:
        type: string
      required: true
    get:
      tags:
      - SLA
      summary: Retrieve the SLA object
      description: Retrieve the specified SLA object.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAGet'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
            application/xml:
              schema:
                $ref: '#/components/schemas/SLAGet'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: New Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
        '400':
          description: Bad Request
          content:
            application/json:
              example:
