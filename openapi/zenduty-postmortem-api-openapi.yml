            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    put:
      tags:
      - Postmortem
      summary: Update the Postmortem data
      description: Updates the specified Postmortem object by setting the values of the parameters passed in the request body. Any parameters not provided will be left unchanged.
      requestBody:
        description: Request body parameters to update the Postmortem object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostmortemPayload'
            example:
              author: 85b563c8-18d0-4668-9462-9
              incidents:
              - incident: U2gGkyJnLQLkX2zQnvkpLW
              title: Modified Infra Postmortem
          application/xml:
            schema:
              $ref: '#/components/schemas/PostmortemPayload'
            example:
              author: 85b563c8-18d0-4668-9462-9
              incidents:
              - incident: U2gGkyJnLQLkX2zQnvkpLW
              title: Modified Infra Postmortem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostmortemPostPut'
              example:
                unique_id: f6778c71-eba2-49da-b226-ca27172d7303
                author: 85b563c8-18d0-4668-9462-9
                status: null
                incidents:
                - unique_id: 80673be0-aa18-4f70-ae92-dec403dfc32e
                  incident: U2gGkyJnLQLkX2zQnvkpLW
                author_name: Vishwa Krishnakumar
                title: Modified Infra Postmortem
                postmortem_data: null
                download_status: 0
            application/xml:
