  /api/v2/account/events/router/{router_id}/rulesets/{ruleset_id}/:
    parameters:
    - name: router_id
      in: path
      description: unique_id of the Global Router object
      schema:
        type: string
      required: true
    - name: ruleset_id
      in: path
      description: unique_id of the Global Router Rule object
      schema:
        type: string
      required: true
    get:
      tags:
      - Global Router Rules
      summary: Retrieve the Global Router Rule object
      description: Retrieve the specified Global Router Rule object.
      responses:
        '200':
          description: OK
          content:
