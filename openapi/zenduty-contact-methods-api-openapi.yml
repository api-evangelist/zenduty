openapi: 3.0.0
info:
  version: 1.1.0
  title: Zenduty Account Custom Role Contact Methods API
  termsOfService: https://zenduty.com
  contact:
    email: vishwa@zenduty.com
  license:
    name: Apache 2.0
  x-logo:
    url: data:image/svg+xml;base64,
  description: "# Introduction\n\nZenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.\n\n\n  Javascript Libraries: https://github.com/Zenduty/zenduty-js\n\n  Ruby Libraries: https://github.com/Zenduty/zenduty-ruby\n\n  Python Libraries: https://github.com/Zenduty/zenduty-python-sdk\n\n  Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git\n\n  Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions\n\n  Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions\n"
servers:
- url: https://www.zenduty.com
security:
- bearerAuth: []
tags:
- name: Contact Methods
  description: This object represents one of the following communication channels(Email, SMS, Phone Call, Slack, Microsoft Team, Google Chat). A user can add multiple contacts methods.
paths:
  /api/account/users/{username}/contacts/:
    parameters:
    - name: username
      in: path
      description: username of the User object
      schema:
        type: string
      required: true
    post:
      tags:
      - Contact Methods
      summary: Create the User Contact Methods object
      description: Create the User Contact Methods object by setting the values of all the required parameters passed in the request body. A user can only create email Contact Methods through API.
      requestBody:
        description: Request body parameters to create the User Contact Methods object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserContactMethodPayload'
            example:
              name: Secondary Email
              value: anshulrajput229@gmail.com
              contact_type: 1
          application/xml:
            schema:
              $ref: '#/components/schemas/UserContactMethodPayload'
            example:
              name: Secondary Email
              value: anshulrajput229@gmail.com
              contact_type: 1
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
                name: Secondary Email
                creation_date: '2023-03-02'
                contact_type: 1
                value: anshulrajput229@gmail.com
                unique_id: 8a862f18-9332-4d08-90ad-06c070803c05
            application/xml:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
                name: Secondary Email
                creation_date: '2023-03-02'
                contact_type: 1
                value: anshulrajput229@gmail.com
                unique_id: 8a862f18-9332-4d08-90ad-06c070803c05
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    get:
      tags:
      - Contact Methods
      summary: List all User Contact Method objects
      description: Returns a list of User Contact Method objects.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
              - name: Primary Email
                creation_date: '2023-02-14'
                contact_type: 1
                value: user@three.com
                unique_id: 374d3e48-b4bd-438d-8e18-d69ddeadd183
              - name: Primary
                creation_date: '2023-03-01'
                contact_type: 2
                value: +91 86993 62839
                unique_id: caabda03-5e15-4cf1-b293-fab41b688ac7
              - name: Secondary Email
                creation_date: '2023-03-02'
                contact_type: 1
                value: anshulrajput229@gmail.com
                unique_id: 8a862f18-9332-4d08-90ad-06c070803c05
            application/xml:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
              - name: Primary Email
                creation_date: '2023-02-14'
                contact_type: 1
                value: user@three.com
                unique_id: 374d3e48-b4bd-438d-8e18-d69ddeadd183
              - name: Primary
                creation_date: '2023-03-01'
                contact_type: 2
                value: +91 86993 62839
                unique_id: caabda03-5e15-4cf1-b293-fab41b688ac7
              - name: Secondary Email
                creation_date: '2023-03-02'
                contact_type: 1
                value: anshulrajput229@gmail.com
                unique_id: 8a862f18-9332-4d08-90ad-06c070803c05
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
  /api/account/users/{username}/contacts/{contact_id}/:
    parameters:
    - name: username
      in: path
      description: username of the User object
      schema:
        type: string
      required: true
    - name: contact_id
      in: path
      description: unique_id of the User Contact Methods object
      schema:
        type: string
      required: true
    get:
      tags:
      - Contact Methods
      summary: Retrieve the User Contact Methods object
      description: Retrieve the specified User's Contact Methods object.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
                name: Primary Email
                creation_date: '2023-02-14'
                contact_type: 1
                value: user@three.com
                unique_id: 374d3e48-b4bd-438d-8e18-d69ddeadd183
            application/xml:
              schema:
                $ref: '#/components/schemas/UserContactMethod'
              example:
                name: Primary Email
                creation_date: '2023-02-14'
                contact_type: 1
                value: user@three.com
                unique_id: 374d3e48-b4bd-438d-8e18-d69ddeadd183
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    delete:
      tags:
      - Contact Methods
      summary: Delete the User Contact Methods object
      description: Delete the specified User's Contact Methods object permanently.
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
components:
  schemas:
    UserContactMethodPayload:
      type: object
      description: Payload schema for the User Contact Methods object
      required:
      - name
      - value
      - contact_type
      properties:
        name:
          type: string
          description: A string that represents the User Contact Method object's name field
        value:
          type: string
          description: A formatted string that represents the User Contact Method object's value field. value can be Email ID, Phone Number, Slack ID, Microsoft ID, Google Chat ID.
        contact_type:
          type: integer
          description: An integer that represents the User Contact Method object's contact_type field. 1 is for Email, 2 is for SMS, 3 is for Phone Call, 4 is for Slack, 5 is for MS Teams and 6 is for Google Chat
    UserContactMethod:
      type: object
      description: User Contact Method object's schema
      properties:
        name:
          type: string
          description: A string that represents the User Contact Method object's name field
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Contact Method object's creation_date
        contact_type:
          type: integer
          description: An integer that represents the User Contact Method object's contact_type field. 1 is for Email, 2 is for SMS, 3 is for Phone Call, 4 is for Slack, 5 is for MS Teams and 6 is for Google Chat
        value:
          type: string
          description: A formatted string that represents the User Contact Method object's value field. value can be Email ID, Phone Number, Slack ID, Microsoft ID, Google Chat ID.
        unique_id:
          type: string
          description: A system-generated string that represents the User Contact Method object's unique_id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
