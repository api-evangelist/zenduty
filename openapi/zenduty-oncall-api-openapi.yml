      description: User object schema
      properties:
        username:
          type: string
          description: A system-generated string that represents the User object's username
        first_name:
          type: string
          description: A string that represents the User object's first_name
        last_name:
          type: string
          description: A string that represents the User object's last_name
        email:
          type: string
          description: A string that represents the User object's email
    EscalationPolicyOnCallV2:
      type: object
      description: Team OnCall object schema v2
