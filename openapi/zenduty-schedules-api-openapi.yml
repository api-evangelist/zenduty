components:
  schemas:
    SchedulePayload:
      type: object
      description: Payload schema for the Schedule object
      required:
      - name
      properties:
        name:
          type: string
          description: A string that represents the Schedule object's name
        summary:
          type: string
          description: A string that represents the Schedule object's summary
        description:
          type: string
          description: A string that represents the Schedule object's description
        time_zone:
          type: string
          description: A formatted string that represents the Schedule object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
        layers:
          type: array
          description: An array of Schedule Layer objects
          items:
            $ref: '#/components/schemas/ScheduleLayerPayload'
        overrides:
          type: array
          description: An array of Schedule Overrides objects
          items:
            $ref: '#/components/schemas/ScheduleOverridePayload'
    ScheduleLayer:
      type: object
      description: Schedule Layer object schema
      properties:
        shift_length:
          type: integer
          description: An integer that represents the Schedule Layer object's shift_length
        restrictions:
          type: array
          description: An array of Schedule Layer Restriction objects
          items:
            $ref: '#/components/schemas/ScheduleLayerRestriction'
        name:
          type: string
          description: A string that represents the Schedule Layer object's name
        users:
          type: array
          description: An array of Schedule Layer User objects
          items:
            $ref: '#/components/schemas/ScheduleLayerUser'
        rotation_start_time:
          type: string
          format: date-time
          description: A formatted string that represents the Schedule Layer object's rotation_start_time
        rotation_end_time:
          type: string
          format: date-time
          description: A formatted string that represents the Schedule Layer object's rotation_end_time
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Layer object's unique_id
        last_edited:
          type: string
          format: date-time
          description: A formatted string that represents the Schedule Layer object's last_edited
        restriction_type:
          type: integer
          description: An integer that represents Schedule Layer object's restriction_type. 0 for no restriction, 1 for daily restrictions and 2 for weekly restrictions
        is_active:
          type: boolean
          default: true
          description: A boolean flag that represents whether the Schedule Layer is active or not
    ScheduleOverride:
      type: object
      description: Schedule Override object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule Overrides object's name
        user:
          type: string
          description: A string that represents the User object's username
        start_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's start_time
        end_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's end_time
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Overrides object's unique_id
    ScheduleLayerRestriction:
      type: object
      description: Schedule Layer Restriction object schema
      properties:
        duration:
          type: integer
          description: An integer that represents the Schedule Layer Restriction objects's duration in seconds
        start_day_of_week:
          type: integer
          description: An integer that represents the Schedule Layer Restriction objects's start_day_of_week. 0 is daily and 1-7 is sunday to saturday
        start_time_of_day:
          type: string
          format: time
          description: A formatted string that represents the Schedule Layer Restriction objects's start_time_of_day
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Layer Restriction objects's unique_id
    Schedule:
      type: object
      description: Schedule object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule object's name
        summary:
          type: string
          description: A string that represents the Schedule object's summary
        description:
          type: string
          description: A string that represents the Schedule object's description
        time_zone:
          type: string
          description: A formatted string that represents the Schedule object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
        team:
          type: string
          description: A system-generated string that represents the Team object's unique_id
        layers:
          type: array
          description: An array of Schedule Layer objects
          items:
            $ref: '#/components/schemas/ScheduleLayer'
        overrides:
          type: array
          description: An array of Schedule Overrides objects
          items:
            $ref: '#/components/schemas/ScheduleOverride'
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule object's unique_id
    ScheduleLayerUserPayload:
      type: object
      description: Schedule Layer User Payload object schema
      properties:
        user:
          type: string
          description: A system-generated string that represents the User object's username
        position:
          type: integer
          description: An integer that represents the Schedule Layer User objects's position
    ScheduleLayerUser:
      type: object
      description: Schedule Layer User object schema
      properties:
        user:
          type: string
          description: A system-generated string that represents the User object's username
        position:
          type: integer
          description: An integer that represents the Schedule Layer User objects's position
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Layer User objects's unique_id
    ScheduleLayerPayload:
      type: object
      description: Schedule Layer Payload object schema
      properties:
        shift_length:
          type: integer
          description: An integer that represents the Schedule Layer object's shift_length
        restrictions:
          type: array
          description: An array of Schedule Layer Restriction objects
          items:
            $ref: '#/components/schemas/ScheduleLayerRestrictionPayload'
        name:
          type: string
          description: A string that represents the Schedule Layer object's name
        users:
          type: array
          description: An array of Schedule Layer User objects
          items:
            $ref: '#/components/schemas/ScheduleLayerUserPayload'
        rotation_start_time:
          type: string
          format: date-time
          description: A formatted string that represents the Schedule Layer object's rotation_start_time
        rotation_end_time:
          type: string
          format: date-time
          description: A formatted string that represents the Schedule Layer object's rotation_end_time
        restriction_type:
          type: integer
          description: An integer that represents Schedule Layer object's restriction_type. 0 for no restriction, 1 for daily restrictions and 2 for weekly restrictions
    ScheduleLayerRestrictionPayload:
      type: object
      description: Schedule Layer Restriction Payload object schema
      properties:
        duration:
          type: integer
          description: An integer that represents the Schedule Layer Restriction objects's duration in seconds
        start_day_of_week:
          type: integer
          description: An integer that represents the Schedule Layer Restriction objects's start_day_of_week. 0 is daily and 1-7 is sunday to saturday
        start_time_of_day:
          type: string
          format: time
          description: A formatted string that represents the Schedule Layer Restriction objects's start_time_of_day
    ScheduleOverridePayload:
      type: object
      description: Schedule Override Payload object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule Overrides object's name
        user:
          type: string
          description: A string that represents the User object's username
        start_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's start_time
        end_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's end_time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
