        description: Request body parameters to create the Escalation Policy object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EPPayload'
            example:
              name: Production Escalation Policy
              rules:
              - delay: 2
                targets:
                - target_type: 2
                  target_id: 85b563c8-18d0-4668-9462-9
                position: 1
          application/xml:
            schema:
              $ref: '#/components/schemas/EPPayload'
            example:
              name: Production Escalation Policy
              rules:
              - delay: 2
                targets:
                - target_type: 2
                  target_id: 85b563c8-18d0-4668-9462-9
                position: 1
