components:
  schemas:
    IncidentFilter:
      type: object
      description: Incident filter object schema
      properties:
        count:
          type: integer
          nullable: true
          description: Please note -> this filed will always be null and will be removed in future version. For pagination, please use the `next` and `previous` fields.
        next:
          type: string
          nullable: true
          description: Link to the next page.
        previous:
          type: string
          nullable: true
          description: Link to the previous page.
        results:
          type: array
          description: A list of filtered incident objects.
          items:
            $ref: '#/components/schemas/IncidentFilterObject'
    IncidentFilterPostmortemObject:
      type: object
      description: Postmortem object schema
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the Postmortem object's unique_id
        title:
          type: string
          description: A string that represents the Postmortem object's title
    IncidentFilterObject:
      type: object
      description: Incident object schema
      properties:
        incident_number:
          type: integer
          description: An integer that represents the Incident object's incident_number
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the Incident object's creation_date
        status:
          type: integer
          default: 1
          description: An integer that represents the Incident object's status. 1 is triggered, 2 is acknowledged and 3 is resolved
        unique_id:
          type: string
          description: A system-generated string that represents the Incident object's unique_id
        sla:
          type: string
          description: A system-generated string that represents the SLA object's unique_id
        service_object:
          $ref: '#/components/schemas/ServicePostPut'
        title:
          type: string
          description: A string that represents the Incident object's title
        assigned_to_name:
          type: string
          description: A string that represents the User object's full name
        tags:
          type: array
          description: An array of Incident Tag objects
          items:
            type: object
            description: Incident Tag object schema for Incident object schema
            properties:
              unique_id:
                type: string
                description: A system-generated string that represents the Incident Tag object's unique_id
              incident:
                type: integer
                description: An integer that represents the the Incident object's incident_number
              creation_date:
                type: string
                format: date-time
                description: A formatted string that represents the Tag object's creation_date
              name:
                type: string
                description: A string that represents the Tag object's name
              color:
                type: string
                description: A string that represents the Tag object's color
              tag_id:
                type: string
                description: A system-generated string that represents the Tag object's unique_id
              team_tag:
                type: string
                description: A system-generated string that represents the Tag object's unique_id
        sla_object:
          type: object
          description: SLA object schema for Incident object schema
          properties:
            unique_id:
              type: string
              description: A system-generated string that represents the SLA object's unique_id
            name:
              type: string
              description: A string that represents the SLA object's name
            is_active:
              type: boolean
              default: true
              description: A boolean flag that represents whether the SLA object is active or not.
            acknowledge_time:
              type: integer
              description: An integer that represents the SLA object's acknowledge_time
            resolve_time:
              type: integer
              description: An integer that represents the SLA object's resolve_time
            creation_date:
              type: string
              format: date-time
              description: A formatted string that represents the SLA object's creation_date
        team_priority_object:
          type: object
          description: Priority object schema for Incident object schema
          properties:
            unique_id:
              type: string
              description: A system-generated string that represents the Priority object's unique_id
            name:
              type: string
              description: A string that represents the Priority object's name
            description:
              type: string
              description: A string that represents the Priority object's description
            color:
              type: string
              description: A string that represents the Priority object's color
        is_child_incident:
          type: boolean
          description: A boolean flag that represents whether the Incident has a child incident or not.
        postmortems:
          type: array
          description: A list of postmortems objects.
          items:
            $ref: '#/components/schemas/IncidentFilterPostmortemObject'
        is_parent_incident:
          type: boolean
          description: A boolean flag that represents whether the Incident has a parent incident or not.
        assigned_to:
          type: string
          description: A system-generated string that represents the User object's username
        acknowledged_date:
          type: string
          format: date-time
          description: A formatted string that represents the Incident object's acknowledged_date
        resolved_date:
          type: string
          format: date-time
          description: A formatted string that represents the Incident object's resolved_date
        snooze_time:
          type: string
          nullable: true
          format: date-time
          description: A formatted string that represents the Incident object's snooze_time
        snoozed_till:
          type: string
          nullable: true
          format: date-time
          description: A formatted string that represents till when the Incident object's will be snoozed
    IncidentFilterPayload:
      type: object
      description: Payload schema for the Incident object
      properties:
        all_teams:
          type: integer
          default: 1
          description: This query parameter can be `0` or `1`. To filter incidents based on all teams use `1` and to filter incidents based on the teams the requesting user belongs to, use `0`. example - `all_teams=1`
        escalation_policy_ids:
          type: array
          description: A list of escalation policy unique ids
          items:
            type: string
            description: unique_id of an Escalation Policy
        from_date:
          type: string
          default: []
          description: Represents from_date and filters incidents whose creation_date is greater than the specified from_date. example - `from_date="2023-02-01"`
        postmortem_filter:
          type: integer
          default: -1
          description: An integer that represents weather the postmortem is attached to the incident or not
        priority_ids:
          type: array
          description: A list of Team Priority unique ids
          items:
            type: string
            description: unique_id of a Team Priority object
        priority_name:
          type: string
          description: Name of the Team priroty object
        service_ids:
          type: array
          description: A list of Service unique ids
          items:
            type: string
            description: unique_id of a Service object
        sla_ids:
          type: array
          description: A list of Team SLA unique ids
          items:
            type: string
            description: unique_id of a Team SLA object
        status:
          type: integer
          default: 1
          description: Status of the Incident object. For open incidents(triggered and acknowledged) use `-1`, for all incidents(triggered, acknowledged and resolved) use `0`, for triggered incidents use `1`, for acknowledged incidents use `2` and for resolved incidents use `3`. example - `status=1`
        tag_ids:
          type: array
          description: A list of Team Tag unique ids
          items:
            type: string
            description: unique_id of a Team Tag object
        team_ids:
          type: array
          description: A list of Team unique ids
          items:
            type: string
            description: unique_id of a Team object
        to_date:
          type: string
          default: []
          description: Represents to_date and filters incidents whose creation_date is lesser than the specified to_date. example - `to_date="2023-02-01"`
        user_ids:
          type: array
          description: A list of User usernames
          items:
            type: string
            description: username of an User object
