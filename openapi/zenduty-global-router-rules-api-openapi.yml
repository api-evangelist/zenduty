                    name: Team 1 Service 1
                    unique_id: 32a7c77f-aa0a-49de-ab52-e52f0aa77888
                  team:
                    name: Team 1
                    unique_id: 91fd3cc0-ebd6-43b8-aab3-67a05762ba0c
