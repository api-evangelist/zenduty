    delete:
      tags:
      - Global Router
      summary: Delete the Global Router  data
      description: Delete the specified Global Router object permanently.
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
