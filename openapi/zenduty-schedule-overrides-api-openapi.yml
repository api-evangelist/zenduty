openapi: 3.0.0
info:
  version: 1.1.0
  title: Zenduty Account Custom Role Schedule Overrides API
  termsOfService: https://zenduty.com
  contact:
    email: vishwa@zenduty.com
  license:
    name: Apache 2.0
  x-logo:
    url: data:image/svg+xml;base64,
  description: "# Introduction\n\nZenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.\n\n\n  Javascript Libraries: https://github.com/Zenduty/zenduty-js\n\n  Ruby Libraries: https://github.com/Zenduty/zenduty-ruby\n\n  Python Libraries: https://github.com/Zenduty/zenduty-python-sdk\n\n  Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git\n\n  Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions\n\n  Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions\n"
servers:
- url: https://www.zenduty.com
security:
- bearerAuth: []
tags:
- name: Schedule Overrides
  description: This object represents the Override of a Schedule. You can checkout the Schedule Override docs here https://docs.zenduty.com/docs/schedules/#schedule-override
paths:
  /api/v2/account/teams/{}/schedules/{}/overrides/:
    parameters:
    - name: team_id
      in: path
      description: unique_id of the Team object
      schema:
        type: string
      required: true
    - name: schedule_id
      in: path
      description: unique_id of the Schedule object
      schema:
        type: string
      required: true
    post:
      tags:
      - Schedule Overrides
      summary: Create the Schedule Override object
      description: Create the Schedule Override object by setting the values of all the required parameters passed in the request body. (Note - Rate limits are 1/sec and 20/minute)
      requestBody:
        description: Request body parameters to create the Schedule Overrides object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleOverridePayload'
            example:
              name: Override for Michael
              user: 507dfda0-a1fd-40e5-943a-e
              start_time: '2022-07-09T05:57:14Z'
              end_time: '2022-07-10T05:57:14Z'
          application/xml:
            schema:
              $ref: '#/components/schemas/ScheduleOverridePayload'
            example:
              name: Override for Michael
              user: 507dfda0-a1fd-40e5-943a-e
              start_time: '2022-07-09T05:57:14Z'
              end_time: '2022-07-10T05:57:14Z'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverride'
              example:
                name: Override for Michael
                user: 507dfda0-a1fd-40e5-943a-e
                start_time: '2022-07-09T05:57:14Z'
                end_time: '2022-07-10T05:57:14Z'
                unique_id: b4492ce7-7d6e-4ed1-8f41-e7c8bf4f4dfe
            application/xml:
              schema:
                $ref: '#/components/schemas/ScheduleOverride'
              example:
                name: Override for Michael
                user: 507dfda0-a1fd-40e5-943a-e
                start_time: '2022-07-09T05:57:14Z'
                end_time: '2022-07-10T05:57:14Z'
                unique_id: b4492ce7-7d6e-4ed1-8f41-e7c8bf4f4dfe
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    get:
      tags:
      - Schedule Overrides
      summary: List all Schedule overrides objects
      description: Returns a list of Schedule override objects with overridden users and their respective start and end times. refer to overridden_details object key (Note - Rate limits are 1/sec and 20/minute)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleOverrideList'
              example:
              - name: Override for Michael
                user: 507dfda0-a1fd-40e5-943a-e
                start_time: '2022-07-09T05:57:14Z'
                end_time: '2022-07-10T05:57:14Z'
                unique_id: b4492ce7-7d6e-4ed1-8f41-e7c8bf4f4dfe
                overridden_details:
                  -"1e57f783-cbd6-4021-811f-e":
                  - start_time: 1725349884
                    end_time: 1725388199
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
components:
  schemas:
    ScheduleOverride:
      type: object
      description: Schedule Override object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule Overrides object's name
        user:
          type: string
          description: A string that represents the User object's username
        start_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's start_time
        end_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's end_time
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Overrides object's unique_id
    ScheduleOverrideList:
      type: object
      description: Schedule Override List object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule Overrides object's name
        user:
          type: string
          description: A string that represents the User object's username
        start_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's start_time
        end_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's end_time
        overridden_details:
          type: string
          description: A string that represents the Overridden details of the Schedule Overrides object
        unique_id:
          type: string
          description: A system-generated string that represents the Schedule Overrides object's unique_id
    ScheduleOverridePayload:
      type: object
      description: Schedule Override Payload object schema
      properties:
        name:
          type: string
          description: A string that represents the Schedule Overrides object's name
        user:
          type: string
          description: A string that represents the User object's username
        start_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's start_time
        end_time:
          type: string
          description: A fromatted string that represents the Schedule Overrides object's end_time
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
