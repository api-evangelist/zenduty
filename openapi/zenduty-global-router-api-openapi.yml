            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    put:
      tags:
      - Global Router
      summary: Update the Global Router data
      description: Updates the specified Global Router object by setting the values of the parameters passed in the request body. Any parameters not provided will be left unchanged.
      requestBody:
        description: Request body parameters to update the Global Router object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalRouterPayload'
            example:
              name: Infra Global Router Updated
              description: This is Infra Global Router Updated for this account
          application/xml:
            schema:
              $ref: '#/components/schemas/GlobalRouterPayload'
            example:
              name: Infra Global Router Updated
              description: This is Infra Global Router Updated for this account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
