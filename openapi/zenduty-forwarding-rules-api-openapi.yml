components:
  schemas:
    UserForwardingRulePayload:
      type: object
      description: Payload schema for the User Forwarding Rules object
      required:
      - from_date
      - to_date
      - to_user
      properties:
        from_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Forwarding Rule object's from_date field
        to_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Forwarding Rule object's to_date field
        time_zone:
          type: string
          description: A formatted string that represents the User Forwarding Rule object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
        to_user:
          type: string
          description: A system-generated string that represents the User object's username
    UserForwardingRule:
      type: object
      description: User Forwarding Rule object's schema
      properties:
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Forwarding Rule object's creation_date
        unique_id:
          type: string
          description: A system-generated string that represents the User Forwarding Rule object's unique_id
        time_zone:
          type: string
          description: A formatted string that represents the User Forwarding Rule object's time zone. You can check out the time zone list here https://timezonedb.com/time-zones
        from_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Forwarding Rule object's from_date field
        to_date:
          type: string
          format: date-time
          description: A formatted string that represents the User Forwarding Rule object's to_date field
        to_user:
          type: string
          description: A system-generated string that represents the User object's username
        created_by:
          type: string
          description: A system-generated string that represents the User object's username
        user:
          type: string
          description: A system-generated string that represents the User object's username
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
