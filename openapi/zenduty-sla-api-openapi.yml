            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    put:
      tags:
      - SLA
      summary: Update the SLA object
      description: Updates the specified SLA object by setting the values of the parameters passed in the request body. Any parameters not provided will be left unchanged.
      requestBody:
        description: Request body parameters to update the SLA object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SLAPayload'
            example:
              name: Modified Infra SLA
              escalations: []
          application/xml:
            schema:
              $ref: '#/components/schemas/SLAPayload'
            example:
              name: Modified Infra SLA
              escalations: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAPostPut'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: Modified Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
            application/xml:
              schema:
                $ref: '#/components/schemas/SLAPostPut'
              example:
                escalations: []
                unique_id: 010bc17d-f688-403d-b762-f039fb6f5ad9
                name: Modified Infra SLA
                description: ''
                is_active: true
                conditions: '{}'
                acknowledge_time: null
                resolve_time: null
                team: 3674
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    delete:
      tags:
      - SLA
      summary: Delete the SLA object
      description: Delete the specified SLA object permanently.
      responses:
        '204':
          description: Success
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
components:
  schemas:
    SLAPayload:
      type: object
      description: Payload schema for the SLA object
      required:
      - escalations
      properties:
        name:
          type: string
          description: An arbitary string that represents the SLA object's name
        escalations:
          type: array
          description: An array of SLA Escalation objects
          items:
            $ref: '#/components/schemas/SLA_Escalation'
        is_active:
          type: boolean
          default: true
          description: A boolean flag that represents whether the SLA object is active or not
        acknowledge_time:
          type: integer
          description: An integer that represents the SLA object's acknowledge_time
        resolve_time:
          type: integer
          description: An integer that represents the SLA object's resolve_time
    SLA_Escalation:
      type: object
      description: SLA Escalation object schema
      properties:
        responder:
          type: array
          description: An array of Responder objects
          items:
            type: object
            description: Responder object schema
            properties:
              user:
                type: string
                description: A system-generated string that represents the User object's username
        unique_id:
          type: string
          description: A system-generated string that represents the SLA Escalation object's unique_id
        time:
          type: integer
          description: An integer that represents the SLA Escalation object's time. The value will be -ve before sla breach and +ve after sla breach
        type:
          type: integer
          description: An integer that represents the SLA Escalation object's type. 1 for acknowledge SLA escalation and 2 for resolve SLA escalation
    SLAGet:
      type: object
      description: SLA object schema
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the SLA object's unique_id
        name:
          type: string
          description: An arbitary string that represents the SLA object's name
        is_active:
          type: boolean
          default: true
          description: A boolean flag that represents whether the SLA object is active or not
        acknowledge_time:
          type: integer
          description: An integer that represents the SLA object's acknowledge_time
        resolve_time:
          type: integer
          description: An integer that represents the SLA object's resolve_time
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the SLA object's creation_date
    SLAPostPut:
      type: object
      description: SLA object schema
      properties:
        escalations:
          type: array
          description: An array of SLA Escalation object
          items:
            $ref: '#/components/schemas/SLA_Escalation'
        unique_id:
          type: string
          description: A system-generated string that represents the SLA object's unique_id
        name:
          type: string
          description: An arbitary string that represents the SLA object's name
        description:
          type: string
          description: An arbitary string that represents the SLA object's description
        is_active:
          type: boolean
          default: true
          description: A boolean flag that represents whether the SLA object is active or not
        conditions:
          type: object
          description: Additional conditions object to create or update the SLA object
        acknowledge_time:
          type: integer
          description: An integer that represents the SLA object's acknowledge_time
        resolve_time:
          type: integer
          description: An integer that represents the SLA object's resolve_time
        team:
          type: integer
          description: An integer that respresents the Team object's id
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
