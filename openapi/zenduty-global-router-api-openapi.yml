components:
  schemas:
    GlobalRouterPayload:
      type: object
      description: Payload schema for the Global Router object
      properties:
        name:
          type: string
          description: A string that represents the Global Router object's name
        description:
          type: string
          description: A string that represents the Global Router object's description
    GlobalRouter:
      description: Global Router object schema
      type: object
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the Global Router object's unique_id
        name:
          type: string
          description: A string that represents the Global Router object's name
        description:
          type: string
          description: A string that represents the Global Router object's description
        account:
          type: string
          description: A system-generated string that represents the Account object's unique_id
        is_enabled:
          type: boolean
          description: A boolean tag that represents weather the Global Router object's is enabled or not
        integration_key:
          type: string
          description: A system-generated string that represents the Integration object's integration_key
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
