openapi: 3.0.0
info:
  version: 1.1.0
  title: Zenduty Account Custom Role Global Router API
  termsOfService: https://zenduty.com
  contact:
    email: vishwa@zenduty.com
  license:
    name: Apache 2.0
  x-logo:
    url: data:image/svg+xml;base64,
  description: "# Introduction\n\nZenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.\n\n\n  Javascript Libraries: https://github.com/Zenduty/zenduty-js\n\n  Ruby Libraries: https://github.com/Zenduty/zenduty-ruby\n\n  Python Libraries: https://github.com/Zenduty/zenduty-python-sdk\n\n  Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git\n\n  Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions\n\n  Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions\n"
servers:
- url: https://www.zenduty.com
security:
- bearerAuth: []
tags:
- name: Global Router
  description: This object represents the Global Router of the Account. You can checkout the global alert routing docs here https://docs.zenduty.com/docs/globalalertrouting
paths:
  /api/v2/account/events/router/:
    post:
      tags:
      - Global Router
      summary: Create the Global Router object
      description: Create the Global Router object by setting the values of all the required parameters passed in the request body.
      requestBody:
        description: Request body parameters to create the Global Router object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalRouterPayload'
            example:
              name: Infra Global Router
              description: This is Infra Global Router for this account
          application/xml:
            schema:
              $ref: '#/components/schemas/GlobalRouterPayload'
            example:
              name: Infra Global Router
              description: This is Infra Global Router for this account
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
                unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
                unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
    get:
      tags:
      - Global Router
      summary: List all Global Router objects
      description: Returns a list of Global Router objects.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
              - unique_id: e9be034e-6076-4953-a315-9a3666ffe774
                name: Default
                description: testing
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: e29c214c-3397-4b92-b4f4-dd63135ad214
              - unique_id: 0dfb3150-456c-4f34-884f-23d449ae7561
                name: Default-2
                description: testing
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: 5d3b2210-6849-42a4-b268-c8f44a5e50f5
              - unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
              - unique_id: e9be034e-6076-4953-a315-9a3666ffe774
                name: Default
                description: testing
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: e29c214c-3397-4b92-b4f4-dd63135ad214
              - unique_id: 0dfb3150-456c-4f34-884f-23d449ae7561
                name: Default-2
                description: testing
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: 5d3b2210-6849-42a4-b268-c8f44a5e50f5
              - unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
  /api/v2/account/events/router/{router_id}/:
    parameters:
    - name: router_id
      in: path
      description: unique_id of the Global Router object
      schema:
        type: string
      required: true
    get:
      tags:
      - Global Router
      summary: Retrieve the Global Router object
      description: Retrieve the specified Global Router object.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
                unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
            application/xml:
              schema:
                $ref: '#/components/schemas/GlobalRouter'
              example:
                unique_id: b0c1867f-dfd2-4cb3-a298-0b9f322fe716
                name: Infra Global Router
                description: This is Infra Global Router for this account
                account: 61fb2d9e-088b-471f-a6d7-872c03cf483d
                is_enabled: true
                integration_key: cb1de2f2-bb17-4a6c-8a80-03739ca0a911
        '400':
          description: Bad Request
          content:
