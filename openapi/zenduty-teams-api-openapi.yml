components:
  schemas:
    User:
      type: object
      description: User object schema
      properties:
        username:
          type: string
          description: A system-generated string that represents the User object's username
        first_name:
          type: string
          description: A string that represents the User object's first_name
        last_name:
          type: string
          description: A string that represents the User object's last_name
        email:
          type: string
          description: A string that represents the User object's email
    TeamMember:
      type: object
      description: Team Member object schema
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the Team Member object's unique_id
        team:
          type: string
          description: A system-generated string that represents the Team object's unique_id
        user:
          $ref: '#/components/schemas/User'
        joining_date:
          type: string
          format: datetime
