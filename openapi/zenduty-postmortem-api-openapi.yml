components:
  schemas:
    PostmortemPostPut:
      type: object
      description: Postmortem object schema
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the Postmortem object's unique_id
        author:
          type: string
          description: A system-generated string that represents the User object's username
        status:
          type: string
          description: A string that represents the Postmortem object's status
        incidents:
          type: array
          description: An array of Postmortem Incident objects
          items:
            type: object
            description: Postmortem Incident object schema
            properties:
              unique_id:
                type: string
                description: A system-generated string that represents the Postmortem Incident object's unique_id
              incident:
                type: string
                description: A system-generated string that represents the Incident object's unique_id
        author_name:
          type: string
          description: A string that represents the User object's full name
        title:
          type: string
          description: A string that represents the Postmortem object's title
        postmortem_data:
          type: string
          description: A string that represents the Postmortem object's postmortem_data
        download_status:
          type: integer
          default: 0
          description: An integer that represents the Postmortem object's download_status. 1 is uninitiated, 2 is initiated, 3 is finished and 4 is error
    PostmortemGet:
      type: object
      description: Postmortem object schema
      properties:
        unique_id:
          type: string
          description: A system-generated string that represents the Postmortem object's unique_id
        author:
          type: string
          description: A system-generated string that represents the User object's username
        status:
          type: string
          description: A string that represents the Postmortem object's status
        postmortem_data:
          type: string
          description: A string that represents the Postmortem object's postmortem_data
        incidents:
          type: array
          description: An array of Postmortem Incident objects
          items:
            type: object
            description: Postmortem Incident object schema
            properties:
              unique_id:
                type: string
                description: A system-generated string that represents the Postmortem Incident object's unique_id
              incident:
                type: object
                description: Incident object schema for a Postmortem object schema
                properties:
                  unique_id:
                    type: string
                    description: A system-generated string that represents the Incident object's unique_id
                  title:
                    type: string
                    description: A string that represents the Incident object's title
                  incident_number:
                    type: integer
                    description: An integer that represents the Incident object's incident_number
        author_name:
          type: string
          description: A string that represents the User object's full name
        title:
          type: string
          description: A string that represents the Postmortem object's title
        download_status:
          type: integer
          default: 0
          description: An integer that represents the Postmortem object's download_status. 1 is uninitiated, 2 is initiated, 3 is finished and 4 is error
        amazon_link:
          type: string
          description: An hyperlink string to AWS
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the Postmortem object's creation_date
    PostmortemPayload:
      type: object
      description: Payload schema for the Postmortem object
      required:
      - author
      - incidents
      properties:
        author:
          type: string
          description: A system-generated string that represents the User object's username
        status:
          type: string
          description: A string that represents the Postmortem object's status
        postmortem_data:
          type: string
          description: A string that represents the Postmortem object's postmortem_data
        incidents:
          type: array
          description: An array of Postmortem Incident objects
          items:
            type: object
            description: Postmortem Incident object schema
            properties:
              incident:
                type: object
                description: Incident object schema for a Postmortem object schema
                properties:
                  unique_id:
                    type: string
                    description: A system-generated string that represents the Incident object's unique_id
                  title:
                    type: string
                    description: A string that represents the Incident object's title
                  incident_number:
                    type: integer
                    description: An integer that represents the Incident object's incident_number
        title:
          type: string
          description: A string that represents the Postmortem object's title
        download_status:
          type: integer
          default: 0
          description: An integer that represents the Postmortem object's download_status. 1 is uninitiated, 2 is initiated, 3 is finished and 4 is error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
