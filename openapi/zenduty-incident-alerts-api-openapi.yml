openapi: 3.0.0
info:
  version: 1.1.0
  title: Zenduty Account Custom Role Incident Alerts API
  termsOfService: https://zenduty.com
  contact:
    email: vishwa@zenduty.com
  license:
    name: Apache 2.0
  x-logo:
    url: data:image/svg+xml;base64,
  description: "# Introduction\n\nZenduty is a cutting edge platform for incident management. With high level automation, Zenduty enables faster and better incident resolution keeping developers first.\n\n\n  Javascript Libraries: https://github.com/Zenduty/zenduty-js\n\n  Ruby Libraries: https://github.com/Zenduty/zenduty-ruby\n\n  Python Libraries: https://github.com/Zenduty/zenduty-python-sdk\n\n  Postman Collection for Zenduty API: https://github.com/Zenduty/zenduty-api-postman.git\n\n  Account-level roles and permissions: https://docs.zenduty.com/docs/users#account-level-roles-and-permissions\n\n  Team-level roles and permissions: https://docs.zenduty.com/docs/users#team-level-roles-and-permissions\n"
servers:
- url: https://www.zenduty.com
security:
- bearerAuth: []
tags:
- name: Incident Alerts
  description: This object represents the incident alerts of an incident.
paths:
  /api/incidents/{incident_number}/alerts/:
    parameters:
    - name: incident_number
      in: path
      description: incident_number of the Incident object
      schema:
        type: string
      required: true
    get:
      tags:
      - Incident Alerts
      summary: List all Incident Alert objects
      description: Returns a list of Incident Alert objects. The Incident Alert objects are sorted by creation_date, with the most recent Incident Alert object appearing last.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAlert'
              example:
              - integration_object:
                  name: Modified Infra custom Integration
                  creation_date: '2022-07-08T12:52:22.906327Z'
                  summary: This is the summary for Infra custom Integration
                  unique_id: 72da1133-a471-4e70-95f3-ce3a5650e9fd
                  service: 191f5e2c-515e-4ee0-b501-3a292f8dae2f
                  team: 61010821-08aa-4098-94f8-f88f1990b54a
                  integration_key: 5f306dae-b327-4ba9-8f3a-ab4cffd57645
                  is_enabled: true
                  integration_type: 0
                summary: ''
                incident: 2
                creation_date: '2022-07-08T13:14:31.300448Z'
                message: Infra Integration Alert
                integration: 72da1133-a471-4e70-95f3-ce3a5650e9fd
                suppressed: false
                entity_id: de8cf7fc-08ee-4966-b8d3-b6b631da
                alert_type: '3'
                unique_id: xc6qbUftpzkQ28f2MxpRxh
                images: []
                urls: []
                notes: []
            application/xml:
              schema:
                $ref: '#/components/schemas/IncidentAlert'
              example:
              - integration_object:
                  name: Modified Infra custom Integration
                  creation_date: '2022-07-08T12:52:22.906327Z'
                  summary: This is the summary for Infra custom Integration
                  unique_id: 72da1133-a471-4e70-95f3-ce3a5650e9fd
                  service: 191f5e2c-515e-4ee0-b501-3a292f8dae2f
                  team: 61010821-08aa-4098-94f8-f88f1990b54a
                  integration_key: 5f306dae-b327-4ba9-8f3a-ab4cffd57645
                  is_enabled: true
                  integration_type: 0
                summary: ''
                incident: 2
                creation_date: '2022-07-08T13:14:31.300448Z'
                message: Infra Integration Alert
                integration: 72da1133-a471-4e70-95f3-ce3a5650e9fd
                suppressed: false
                entity_id: de8cf7fc-08ee-4966-b8d3-b6b631da
                alert_type: '3'
                unique_id: xc6qbUftpzkQ28f2MxpRxh
                images: []
                urls: []
                notes: []
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                detail: This request can not be processed.
            application/xml:
              example:
                detail: This request can not be processed.
        '403':
          description: Forbidden
          content:
            application/json:
              example:
                detail: You do not have permission to perform this action.
            application/xml:
              example:
                detail: You do not have permission to perform this action.
        '404':
          description: Not Found
          content:
            application/json:
              example:
                detail: Not Found.
            application/xml:
              example:
                detail: Not Found.
components:
  schemas:
    Integration:
      description: Integration object schema
      type: object
      properties:
        name:
          type: string
          description: A string that represents the Integration object's name
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the Integration object's creation_date
        summary:
          type: string
          description: A string that represents the Integration object's summary
        unique_id:
          type: string
          description: A system-generated string that represents the Integration object's unique_id
        service:
          type: string
          description: A system-generated string that represents the Service object's unique_id
        application:
          type: string
          description: A system-generated string that represents the Application object's unique_id
        application_reference:
          $ref: '#/components/schemas/Application'
        integration_key:
          type: string
          description: A system-generated string that represents the Integration object's integration_key
        created_by:
          type: string
          description: A system-generated string that represents the User object's username
        is_enabled:
          type: boolean
          default: true
          description: A boolean flag that represents whether an Integration is enabled or not
        create_incidents_for:
          type: integer
          default: 1
          description: An integer that represents the type of the Incidents this Integration object will create. 0 is do not create incidents. 1 is critical, 2 is critical and errors, and 3 is critical, errors and warnings.
        integration_type:
          type: integer
          default: 0
          description: An integer that represents the Integration object's integration_type. 0 is alert and 1 is outbound.
        default_urgency:
          type: integer
          default: 1
          description: An integer that represents the Integration object's default_urgency. 0 is low and 1 is high.
        webhook_url:
          type: string
          description: A system-generated string that represents the Integration object's webhook url
    EventUrl:
      type: object
      description: Event URL object schema
      properties:
        link_url:
          type: string
          description: A string that represents the Event URL object's link_url
        link_text:
          type: string
          description: A string that represents the Event URL object's link_text
    IncidentAlert:
      type: object
      description: Incident Alert object schema
      properties:
        integration_object:
          $ref: '#/components/schemas/Integration'
        summary:
          type: string
          description: A string that represents the Incident Alert object's summary
        incident:
          type: integer
          description: An integer that represents the Incident object's incident_number
        creation_date:
          type: string
          format: date-time
          description: A formatted string that represents the Incident Alert object's creation_date
        message:
          type: string
          description: A string that represents the Incident Alert object's message
        integration:
          type: string
          description: A system-generated string that represents the Integration object's unique_id
        suppressed:
          type: boolean
          default: false
          description: A boolean flag that represents whether the Incident Alert object is suppressed or not.
        entity_id:
          type: string
          description: A system-generated string that represents the Incident Alert object's entity_id
        alert_type:
          type: integer
          default: 1
          description: An integer that represents the Incident Alert object's type. 0 is info, 1 is warning, 2 is error, 3 is critical, 4 is acknowledged and 5 is resolved
        unique_id:
          type: string
          description: A system-generated string that represents the Incident Alert object's unique_id
        images:
          type: array
          items:
            $ref: '#/components/schemas/EventImage'
        urls:
          type: array
          items:
            $ref: '#/components/schemas/EventUrl'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/EventNote'
    EventNote:
      type: object
      description: Event Note object schema
      properties:
        note_title:
          type: string
          description: A string that represents the Event Note object's note_title
        note_text:
          type: string
          description: A string that represents the Event Note object's note_text
    EventImage:
      type: object
      description: Event Image object schema
      properties:
        image_src:
          type: string
          description: A string that represents the Event Image object's image_src
        image_url:
          type: string
          description: A string that represents the Event Image object's image_url
        image_text:
          type: string
          description: A string that represents the Event Image object's image_text
    Application:
      description: Application object schema
      type: object
      properties:
        name:
          type: string
          description: A string that represents Application object's name
        icon_url:
          type: string
          description: A string that represents Application object's icon_url
        summary:
          type: string
          description: A string that represents Application object's summary
        description:
          type: string
          description: A string that represents Application object's description
        unique_id:
          type: string
          description: A system-generated string that represents Application object's unique_id
        availability_plan_id:
          type: integer
          description: An integer that represents Application object's availability_plan_id
        setup_instructions:
          type: string
          description: A string that represents Application object's setup_instructions
        extension:
          type: string
          description: A string that represents Application object's extension
        application_type:
          type: integer
          description: An integer that represents Application object's application_type 0 for alert and 1 for outbound
        categories:
          type: string
          description: A string that represents Application object's categories
        documentation_link:
          type: string
          description: A string that represents Application object's documentation_link
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token <api_key>
